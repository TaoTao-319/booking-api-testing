$kind: http-request
url: "{{base_url}}/booking/{{booking_id}}"
method: GET
scripts:
  - type: afterResponse
    code: |
      pm.test("不存在的预约查询返回404", function () {
          pm.response.to.have.status(404);

          const data = pm.response.json();
          pm.expect(data.error).to.eql("Booking or endpoint not found");
      });
    language: text/javascript
order: 4000
name: 查询预约_ID不存在
auth:
  type: noauth
