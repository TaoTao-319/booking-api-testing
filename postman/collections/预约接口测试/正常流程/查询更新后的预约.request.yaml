$kind: http-request
url: "{{base_url}}/booking/{{booking_id}}"
method: GET
scripts:
  - type: afterResponse
    code: >
      pm.test("状态码和响应格式正确", function () {
          pm.response.to.have.status(200);
          pm.expect(pm.response.headers.get("Content-Type"))
              .to.include("application/json");
      });


      pm.test("预约数据正确", function () {
          const data = pm.response.json();

          pm.expect(data.firstname).to.eql("Alex");
          pm.expect(data.lastname).to.eql(pm.environment.get("booking_lastname"));
          pm.expect(data.totalprice).to.eql(300);
          pm.expect(data.depositpaid).to.eql(true);

          pm.expect(data.bookingdates).to.be.an("object");
          pm.expect(data.bookingdates.checkin).to.eql("2026-11-01");
          pm.expect(data.bookingdates.checkout).to.eql("2026-11-03");
      });


      pm.test("再次查询确认完整更新结果", function () {
          pm.expect(pm.response.json()).to.deep.eql(JSON.parse(pm.environment.get("booking_updated")));
      });
    language: text/javascript
order: 8000
name: 查询更新后的预约
auth:
  type: noauth
