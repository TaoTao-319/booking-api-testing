$kind: http-request
url: "{{base_url}}/booking/{{booking_id}}"
method: GET
scripts:
  - type: afterResponse
    code: |
      pm.test("已删除的预约无法查询", function () {
          pm.response.to.have.status(404);

          pm.expect(pm.response.json().error)
              .to.eql("Booking or endpoint not found");
      });
    language: text/javascript
order: 10000
name: 查询已删除预约
auth:
  type: noauth
