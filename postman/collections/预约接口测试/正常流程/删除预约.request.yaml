$kind: http-request
url: "{{base_url}}/booking/{{booking_id}}"
method: DELETE
headers:
  Cookie: token={{token}}
scripts:
  - type: afterResponse
    code: |
      pm.test("删除成功", function () {
          pm.response.to.have.status(201);

          pm.expect(pm.response.json().message)
              .to.eql("Booking deleted");
      });
    language: text/javascript
order: 9000
name: 删除预约
auth:
  type: noauth
