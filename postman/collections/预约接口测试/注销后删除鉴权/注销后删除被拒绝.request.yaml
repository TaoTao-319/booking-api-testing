$kind: http-request
url: "{{base_url}}/booking/{{booking_id}}"
method: DELETE
headers:
  Content-Type: application/json
  Cookie: token={{revoked_token}}
body:
  type: json
  content: |-
    {
      "firstname": "Alex",
      "lastname": "{{booking_lastname}}",
      "totalprice": 300,
      "depositpaid": true,
      "bookingdates": {
        "checkin": "2026-11-01",
        "checkout": "2026-11-03"
      },
      "additionalneeds": "Breakfast"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |
      pm.test("已注销的token不能删除预约", function () {
          pm.response.to.have.status(403);

          pm.expect(pm.response.json()).to.deep.eql({
              error: "A valid token cookie is required"
          });
      });
    language: text/javascript
order: 4000
