$kind: http-request
url: "{{base_url}}/booking/{{booking_id}}"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |
      pm.test("查询确认价格已保存，其他字段未变", function () {
          pm.response.to.have.status(200);

          const expected = JSON.parse(
              pm.environment.get("booking_original")
          );
          expected.totalprice = 350;

          pm.expect(pm.response.json()).to.deep.eql(expected);
      });
    language: text/javascript
order: 5000
