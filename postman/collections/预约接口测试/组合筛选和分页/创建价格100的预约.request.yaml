$kind: http-request
url: "{{base_url}}/booking"
method: POST
body:
  type: json
  content: "{\r

    \  \"firstname\": \"QueryLearner\",\r

    \  \"lastname\": \"{{query_lastname}}\",\r

    \  \"totalprice\": 100,\r

    \  \"depositpaid\": true,\r

    \  \"bookingdates\": {\r

    \    \"checkin\": \"2026-11-01\",\r

    \    \"checkout\": \"2026-11-03\"\r

    \  },\r

    \  \"additionalneeds\": \"Breakfast\"\r

    }"
scripts:
  - type: afterResponse
    code: |
      const idKey = "query_id_100";

      pm.test("预约创建成功并保存实际编号", function () {
          pm.response.to.have.status(200);

          const data = pm.response.json();
          const expected = JSON.parse(
              pm.variables.replaceIn(pm.request.body.raw)
          );

          pm.expect(Number.isInteger(data.bookingid)).to.eql(true);
          pm.expect(data.bookingid).to.be.above(0);
          pm.expect(data.booking).to.deep.eql(expected);

          pm.environment.set(idKey, data.bookingid);
      });
    language: text/javascript
  - type: beforeRequest
    code: |
      
      pm.environment.set(
          "query_lastname",
          "Query_" + pm.variables.replaceIn("{{$guid}}")
      );


      ["query_id_100", "query_id_200", "query_id_300"].forEach(function (key) {
          pm.environment.set(key, "");
      });
      pm.environment.set("paging_seen", "[]");
    language: text/javascript
order: 2000
