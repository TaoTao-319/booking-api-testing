$kind: http-request
url: "{{base_url}}/booking/{{booking_id}}"
method: DELETE
scripts:
  - type: afterResponse
    code: |
      pm.test("无有效凭证时拒绝删除", function () {
          pm.response.to.have.status(403);

          const data = pm.response.json();
          pm.expect(data.error)
              .to.eql("A valid token cookie is required");
      });
    language: text/javascript
order: 9000
name: 删除预约_未携带token
auth:
  type: noauth
