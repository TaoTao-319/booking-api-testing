$kind: http-request
url: "{{base_url}}/booking"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "lastname": "Learner",
      "totalprice": 200,
      "depositpaid": true,
      "bookingdates": {
        "checkin": "2026-11-01",
        "checkout": "2026-11-03"
      },
      "additionalneeds": "Breakfast"
    }
scripts:
  - type: afterResponse
    code: |
      pm.test("错误输入返回400", function () {
          pm.response.to.have.status(400);
      });

      pm.test("返回预期错误说明", function () {
          const data = pm.response.json();

          pm.expect(data.error).to.be.a("string");
          pm.expect(data.error).to.eql("Missing field: firstname");
      });
    language: text/javascript
order: 1000
name: 缺少firstname
auth:
  type: noauth
