$kind: http-request
url: "{{base_url}}/booking"
method: POST
body:
  type: json
  content: "{\r

    \  \"firstname\": \"   \",\r

    \  \"lastname\": \"Learner\",\r

    \  \"totalprice\": 200,\r

    \  \"depositpaid\": true,\r

    \  \"bookingdates\": {\r

    \    \"checkin\": \"2026-11-01\",\r

    \    \"checkout\": \"2026-11-03\"\r

    \  },\r

    \  \"additionalneeds\": \"Breakfast\"\r

    }"
scripts:
  - type: afterResponse
    code: |
      pm.test("全空格姓名被拒绝", function () {
          pm.response.to.have.status(400);
          pm.expect(pm.response.json()).to.deep.eql({
              error: "Must not be blank: firstname"
          });
      });
    language: text/javascript
order: 7000
